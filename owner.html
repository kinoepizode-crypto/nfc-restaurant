
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFC SMART — Кабинет владельца</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f4f1e8;color:#26352a;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
.card{background:#fff;border:1px solid #dfe5d7;border-radius:18px;padding:20px;margin-bottom:16px}
h1,h2{color:#344b35}
input,textarea,select,button{width:100%;padding:13px;margin:8px 0;border:1px solid #dfe5d7;border-radius:12px;font-size:15px}
textarea{min-height:90px}
button{border:0;background:#647b4f;color:white;font-weight:bold}
.secondary{background:#344b35}
.gray{background:#788476}
label{display:block;font-weight:bold;margin-top:12px;font-size:13px}
.preview{max-width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}
#panel{display:none}
#status{white-space:pre-wrap;color:#526b46;padding:10px}
.small{font-size:12px;color:#788476}
.feedback-item{padding:14px;border:1px solid #ddd;border-radius:14px;margin-top:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:#f1f5ec;border-radius:15px;padding:18px;text-align:center}
.stat-number{font-size:30px;font-weight:bold}
.stat-label{font-size:13px}
</style>
</head>
<body>
<div class="container">

<div class="card">
<h1>NFC SMART</h1>
<p>Панель владельца</p>
</div>

<div class="card" id="login">
<h2>Вход</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<button onclick="login()">Войти</button>
</div>

<div id="panel">

<div class="card">
<h2>Основная информация</h2>
<input id="name" placeholder="Название компании">
<select id="category">
<option value="">Категория</option>
<option>Ресторан</option>
<option>Кафе</option>
<option>Кофейня</option>
<option>Стоматология</option>
<option>Салон красоты</option>
<option>Барбершоп</option>
<option>СТО</option>
<option>Магазин</option>
<option>Отель</option>
<option>Фитнес</option>
<option>Другое</option>
</select>
<textarea id="description" placeholder="Описание"></textarea>

<label>Логотип</label>
<input id="logoFile" type="file" accept="image/*">
<img id="logoPreview" class="preview" style="display:none">

<label>Обложка</label>
<input id="coverFile" type="file" accept="image/*">
<img id="coverPreview" class="preview" style="display:none">
</div>

<div class="card">
<h2>Wi-Fi</h2>
<input id="wifi_name" placeholder="Название Wi-Fi">
<input id="wifi_password" placeholder="Пароль">
</div>

<div class="card">
<h2>Контакты и ссылки</h2>
<input id="menu_url" placeholder="Меню или сайт">
<input id="phone" placeholder="Телефон">
<input id="address" placeholder="Адрес">
<input id="instagram" placeholder="Instagram">
<input id="whatsapp" placeholder="WhatsApp">
<input id="maps_url" placeholder="Google Maps">
<input id="two_gis_url" placeholder="2ГИС">
<input id="reviews_url" placeholder="Ссылка на отзывы">
</div>

<!-- ПРОГРАММА ЛОЯЛЬНОСТИ -->
<div class="card">
<h2>☕ Программа лояльности</h2>

<label style="display:flex;align-items:center;gap:10px">
<input id="loyalty_enabled" type="checkbox" style="width:auto">
Включить программу 7+1
</label>

<p class="small">
Клиент покупает заданное количество напитков и получает награду.
Программа включается только по желанию владельца.
</p>

<label>Количество покупок для награды</label>
<input id="loyalty_goal" type="number" min="1" max="100" value="7">

<label>Награда</label>
<input id="loyalty_reward" value="Бесплатный 8-й кофе" placeholder="Например: Бесплатный кофе">

</div>
<!-- КОНЕЦ ПРОГРАММЫ ЛОЯЛЬНОСТИ -->

<div class="card">
<h2>Статистика</h2>
<div class="stats-grid">
<div class="stat-box">
<div class="stat-number" id="totalVisits">—</div>
<div class="stat-label">Всего посещений</div>
</div>
<div class="stat-box">
<div class="stat-number" id="todayVisits">—</div>
<div class="stat-label">Сегодня</div>
</div>
</div>
<button class="gray" onclick="loadStats()">Обновить статистику</button>
</div>

<div class="card">
<h2>Жалобы клиентов</h2>
<button class="gray" onclick="loadFeedback()">Обновить жалобы</button>
<div id="feedbackList">Загрузка...</div>
</div>

<div class="card">
<button onclick="save()">Сохранить всё</button>
<button class="secondary" onclick="openPage()">Открыть страницу</button>
<button class="gray" onclick="logout()">Выйти</button>
</div>

</div>

<div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
"https://pyeydqohexospkzzehtz.supabase.co",
"sb_publishable_X_pgMWZNfTyELx6z-Y4f1Q_3qwj6FEc",
{
auth:{
persistSession:false,
autoRefreshToken:false,
detectSessionInUrl:false
}
}
);

let businessId=null;
let currentBusiness=null;
let logoUrl="";
let coverUrl="";
let busy=false;

function message(t){
document.getElementById("status").textContent=t;
}

function timeout(p,ms=30000){
return Promise.race([
p,
new Promise((_,reject)=>setTimeout(()=>reject(new Error("Время ожидания истекло. Проверьте интернет.")),ms))
]);
}

async function login(){
message("Вход...");
try{
const {error}=await client.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});
if(error)throw error;
await loadBusiness();
}catch(e){
message("Ошибка: "+e.message);
}
}

async function loadBusiness(){
message("Загрузка...");
try{
const {data:u,error:ue}=await client.auth.getUser();
if(ue)throw ue;
if(!u.user)throw new Error("Пользователь не найден");

const {data:m,error:me}=await client.from("business_members")
.select("business_id")
.eq("user_id",u.user.id);

if(me)throw me;
if(!m||!m.length)throw new Error("Компания не привязана");

businessId=m[0].business_id;

const {data,error}=await client.from("businesses")
.select("*").eq("id",businessId).single();

if(error)throw error;
currentBusiness=data;

const fields=[
"name","description","wifi_name","wifi_password",
"menu_url","phone","address","instagram","whatsapp",
"maps_url","two_gis_url","reviews_url"
];

fields.forEach(k=>{
const el=document.getElementById(k);
if(el)el.value=data[k]||"";
});

document.getElementById("category").value=data.category||"";

document.getElementById("loyalty_enabled").checked=!!data.loyalty_enabled;
document.getElementById("loyalty_goal").value=data.loyalty_goal||7;
document.getElementById("loyalty_reward").value=data.loyalty_reward||"Бесплатный 8-й кофе";

logoUrl=data.logo_url||"";
coverUrl=data.cover_url||"";

showPreview("logoPreview",logoUrl);
showPreview("coverPreview",coverUrl);

document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";

message("Данные загружены");

loadFeedback();
loadStats();

}catch(e){
message("Ошибка: "+e.message);
}
}

function showPreview(id,url){
const img=document.getElementById(id);
if(url){
img.src=url;
img.style.display="block";
}else{
img.removeAttribute("src");
img.style.display="none";
}
}

function compressImage(file){
return new Promise((resolve,reject)=>{
if(!file.type.startsWith("image/")){
reject(new Error("Файл не является фотографией"));
return;
}

const img=new Image();
const objectUrl=URL.createObjectURL(file);

img.onload=()=>{
try{
const max=1400;
const scale=Math.min(1,max/Math.max(img.width,img.height));
const canvas=document.createElement("canvas");
canvas.width=Math.max(1,Math.round(img.width*scale));
canvas.height=Math.max(1,Math.round(img.height*scale));

const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,canvas.width,canvas.height);

canvas.toBlob(blob=>{
URL.revokeObjectURL(objectUrl);
if(!blob){
reject(new Error("Не удалось сжать фотографию"));
return;
}
resolve(new File([blob],"photo.jpg",{type:"image/jpeg"}));
},"image/jpeg",0.75);

}catch(e){
URL.revokeObjectURL(objectUrl);
reject(e);
}
};

img.onerror=()=>{
URL.revokeObjectURL(objectUrl);
reject(new Error("Не удалось открыть фотографию"));
};

img.src=objectUrl;
});
}

async function uploadImage(file){
message("Сжатие фотографии...");
const compressed=await compressImage(file);

const path=businessId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+".jpg";

message("Загрузка фотографии...");

const result=await timeout(
client.storage.from("business-images")
.upload(path,compressed,{upsert:false}),
45000
);

if(result.error)throw result.error;

const {data}=client.storage.from("business-images").getPublicUrl(path);
return data.publicUrl;
}

document.getElementById("logoFile").addEventListener("change",function(){
if(this.files[0])showPreview("logoPreview",URL.createObjectURL(this.files[0]));
});

document.getElementById("coverFile").addEventListener("change",function(){
if(this.files[0])showPreview("coverPreview",URL.createObjectURL(this.files[0]));
});

async function save(){
if(busy)return;
if(!businessId){
message("Сначала войдите");
return;
}

busy=true;
const btn=document.querySelector("#panel .card:last-child button");
btn.disabled=true;

try{
message("Подготовка данных...");

const updates={};

const fields=[
"name","description","wifi_name","wifi_password",
"menu_url","phone","address","instagram","whatsapp",
"maps_url","two_gis_url","reviews_url"
];

fields.forEach(k=>{
updates[k]=document.getElementById(k).value.trim();
});

updates.category=document.getElementById("category").value;

updates.loyalty_enabled=document.getElementById("loyalty_enabled").checked;
updates.loyalty_goal=Math.max(1,Math.min(100,parseInt(document.getElementById("loyalty_goal").value,10)||7));
updates.loyalty_reward=document.getElementById("loyalty_reward").value.trim()||"Бесплатный 8-й кофе";

updates.logo_url=logoUrl;
updates.cover_url=coverUrl;

const lf=document.getElementById("logoFile").files[0];
const cf=document.getElementById("coverFile").files[0];

if(lf){
message("Загрузка логотипа...");
updates.logo_url=await uploadImage(lf);
}

if(cf){
message("Загрузка обложки...");
updates.cover_url=await uploadImage(cf);
}

message("Сохранение в базу данных...");

const {error}=await timeout(
client.from("businesses")
.update(updates)
.eq("id",businessId),
30000
);

if(error)throw error;

currentBusiness={...currentBusiness,...updates};
logoUrl=updates.logo_url;
coverUrl=updates.cover_url;
document.getElementById("logoFile").value="";
document.getElementById("coverFile").value="";

showPreview("logoPreview",logoUrl);
showPreview("coverPreview",coverUrl);
message("Успешно сохранено!");

}catch(e){
message("Ошибка сохранения: "+e.message);
}finally{
busy=false;
btn.disabled=false;
}
}

async function loadStats(){
if(!businessId)return;

try{
const {count:total,error}=await client.from("visits")
.select("*",{count:"exact",head:true})
.eq("business_id",businessId);

if(error)throw error;

const start=new Date();
start.setHours(0,0,0,0);
const end=new Date(start);
end.setDate(end.getDate()+1);

const {count:today,error:e}=await client.from("visits")
.select("*",{count:"exact",head:true})
.eq("business_id",businessId)
.gte("created_at",start.toISOString())
.lt("created_at",end.toISOString());

if(e)throw e;

document.getElementById("totalVisits").textContent=total??0;
document.getElementById("todayVisits").textContent=today??0;

}catch(e){
document.getElementById("totalVisits").textContent="—";
document.getElementById("todayVisits").textContent="—";
}
}

async function loadFeedback(){
const box=document.getElementById("feedbackList");
if(!businessId)return;

box.textContent="Загрузка...";

try{
const {data,error}=await client.from("feedback")
.select("*")
.eq("business_id",businessId)
.order("created_at",{ascending:false});

if(error)throw error;

if(!data||!data.length){
box.textContent="Жалоб пока нет.";
return;
}

box.innerHTML="";

data.forEach(item=>{
const card=document.createElement("div");
card.className="feedback-item";

const stars=document.createElement("div");
stars.textContent="⭐".repeat(item.rating);

const msg=document.createElement("p");
msg.textContent=item.message;

const date=document.createElement("p");
date.className="small";
date.textContent=new Date(item.created_at).toLocaleString("ru-RU");

const status=document.createElement("p");
status.textContent=item.status==="processed"?"Обработано":"Новая жалоба";

card.append(stars,msg,date,status);

if(item.status!=="processed"){
const btn=document.createElement("button");
btn.textContent="Обработано";
btn.onclick=()=>markProcessed(item.id);
card.appendChild(btn);
}

box.appendChild(card);
});

}catch(e){
box.textContent="Ошибка: "+e.message;
}
}

async function markProcessed(id){
message("Обновление...");

const {error}=await client.from("feedback")
.update({status:"processed"})
.eq("id",id)
.eq("business_id",businessId);

if(error){
message("Ошибка: "+error.message);
return;
}

message("Обработано");
loadFeedback();
}

function openPage(){
if(!currentBusiness)return;
window.open(
"https://nfc-restaurant-two.vercel.app/?slug="+encodeURIComponent(currentBusiness.slug||""),
"_blank"
);
}

async function logout(){
await client.auth.signOut();
businessId=null;
currentBusiness=null;
logoUrl="";
coverUrl="";

document.getElementById("panel").style.display="none";
document.getElementById("login").style.display="block";
document.getElementById("email").value="";
document.getElementById("password").value="";

message("Вы вышли");
}
</script>
</body>
</html>
