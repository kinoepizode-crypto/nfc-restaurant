
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель владельца</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px;color:#111}
.container{max-width:500px;margin:auto;background:white;padding:22px;border-radius:16px}
h2{text-align:center}
input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{background:#111;color:white;border:0;font-weight:bold;cursor:pointer}
#panel{display:none}
#status{white-space:pre-wrap;color:#d00;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h2>Панель ресторана</h2>

<div id="login">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<button onclick="login()">Войти</button>
</div>

<div id="panel">
<h3>Информация ресторана</h3>
<input id="name" placeholder="Название ресторана">
<textarea id="description" placeholder="Описание"></textarea>
<input id="wifi_name" placeholder="Название Wi-Fi">
<input id="wifi_password" placeholder="Пароль Wi-Fi">
<textarea id="menu_url" placeholder="Ссылка на меню"></textarea>
<input id="phone" placeholder="Телефон">
<input id="address" placeholder="Адрес">
<input id="instagram" placeholder="Instagram">
<input id="whatsapp" placeholder="WhatsApp">
<input id="maps_url" placeholder="Ссылка на Google Maps">
<input id="two_gis_url" placeholder="Ссылка на 2ГИС">
<button onclick="save()">Сохранить</button>
<button onclick="logout()" style="background:#555">Выйти</button>
</div>

<p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client = window.supabase.createClient(
  "https://pyeydqohexospkzzehtz.supabase.co",
  "sb_publishable_X_pgMWZNfTyELx6z-Y4f1Q_3qwj6FEc"
);

let businessId = null;

function message(text){
  document.getElementById("status").textContent = text;
}

async function login(){
  message("Выполняется вход...");
  try{
    const {data,error} = await client.auth.signInWithPassword({
      email:document.getElementById("email").value.trim(),
      password:document.getElementById("password").value
    });
    if(error) throw error;
    await loadBusiness();
  }catch(e){
    message("Ошибка: "+e.message);
  }
}

async function loadBusiness(){
  message("Загрузка ресторана...");
  try{
    const {data:userData,error:userError} = await client.auth.getUser();
    if(userError) throw userError;
    if(!userData.user) throw new Error("Пользователь не найден");

    const {data:members,error:memberError} = await client
      .from("business_members")
      .select("business_id")
      .eq("user_id",userData.user.id);

    if(memberError) throw memberError;
    if(!members || members.length===0)
      throw new Error("Ресторан не привязан к аккаунту");

    businessId=members[0].business_id;

    const {data:business,error:businessError} = await client
      .from("businesses")
      .select("*")
      .eq("id",businessId)
      .single();

    if(businessError) throw businessError;

    const fields=[
      "name","description","wifi_name","wifi_password",
      "menu_url","phone","address","instagram","whatsapp",
      "maps_url","two_gis_url"
    ];

    fields.forEach(key=>{
      const el=document.getElementById(key);
      if(el) el.value=business[key] || "";
    });

    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    message("Ресторан загружен!");
  }catch(e){
    message("Ошибка: "+e.message);
  }
}

async function save(){
  message("Сохранение...");
  try{
    const fields=[
      "name","description","wifi_name","wifi_password",
      "menu_url","phone","address","instagram","whatsapp",
      "maps_url","two_gis_url"
    ];

    const updates={};
    fields.forEach(key=>{
      updates[key]=document.getElementById(key).value;
    });

    const {error}=await client
      .from("businesses")
      .update(updates)
      .eq("id",businessId);

    if(error) throw error;
    message("Сохранено успешно!");
  }catch(e){
    message("Ошибка сохранения: "+e.message);
  }
}

async function logout(){
  await client.auth.signOut();
  businessId=null;
  document.getElementById("panel").style.display="none";
  document.getElementById("login").style.display="block";
  message("Вы вышли");
}
</script>
</body>
</html>
