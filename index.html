
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ресторан</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1e8;color:#222;font-family:Arial,sans-serif;padding:20px}
.container{max-width:700px;margin:auto}
.hero{background:#173e35;color:white;padding:45px 25px;border-radius:28px;text-align:center;margin-bottom:25px}
.hero h1{font-size:36px;margin:20px 0}
.hero p{font-size:18px;color:#d6dfd8}
.section{margin:25px 0}
.section h2{font-size:22px}
.card{background:white;padding:20px;border-radius:20px;margin:12px 0;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link{display:block;text-decoration:none;color:#173e35;background:white;padding:17px;border-radius:16px;text-align:center;font-weight:bold}
button{border:0;background:#173e35;color:white;padding:13px 18px;border-radius:12px;font-weight:bold}
.muted{color:#777}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<div style="font-size:40px">🍽️</div>
<p style="letter-spacing:4px">ДОБРО ПОЖАЛОВАТЬ</p>
<h1 id="name">Загрузка...</h1>
<p id="description"></p>
</div>

<div id="wifiSection" class="section" style="display:none">
<h2>📶 Wi-Fi для гостей</h2>
<div class="card">
<strong id="wifiName"></strong>
<p id="wifiPassword"></p>
<button onclick="copyPassword()">Копировать пароль</button>
</div>
</div>

<div id="linksSection" class="section" style="display:none">
<h2>🔗 Полезные ссылки</h2>
<div class="grid" id="links"></div>
</div>

<div id="addressSection" class="section" style="display:none">
<h2>📍 Адрес</h2>
<div class="card" id="address"></div>
</div>

<footer>NFC Restaurant · Информация ресторана в одном месте</footer>
<p id="status" class="muted"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
"https://pyeydqohexospkzzehtz.supabase.co",
"sb_publishable_X_pgMWZNfTyELx6z-Y4f1Q_3qwj6FEc"
);

const demoBusinessId="d9be3b99-2ac3-42ef-8426-aa98c8de93d7";
const requestedSlug=new URLSearchParams(location.search).get("slug");
let wifiPass="";

async function load(){
const status=document.getElementById("status");
try{
let request=client.from("businesses").select("*");
if(requestedSlug){
request=request.eq("slug",requestedSlug);
}else{
request=request.eq("id",demoBusinessId);
}
const {data,error}=await request.single();
if(error)throw error;
if(!data)throw new Error("Ресторан не найден");

document.title=(data.name||"Ресторан")+" — NFC Restaurant";
document.getElementById("name").textContent=data.name||"Ресторан";
document.getElementById("description").textContent=data.description||"";
status.textContent="Информация ресторана загружена.";

if(data.wifi_name||data.wifi_password){
document.getElementById("wifiSection").style.display="block";
document.getElementById("wifiName").textContent=data.wifi_name||"Wi-Fi";
wifiPass=data.wifi_password||"";
document.getElementById("wifiPassword").textContent="Пароль: "+(wifiPass||"не указан");
}

const links=[];
if(data.menu_url)links.push(["📖 Меню",data.menu_url]);
if(data.phone)links.push(["📞 Позвонить","tel:"+data.phone]);
if(data.instagram)links.push(["📸 Instagram",data.instagram.startsWith("http")?data.instagram:"https://instagram.com/"+data.instagram.replace("@","")]);
if(data.whatsapp)links.push(["💬 WhatsApp",data.whatsapp.startsWith("http")?data.whatsapp:"https://wa.me/"+data.whatsapp.replace(/\D/g,"")]);
if(data.maps_url)links.push(["📍 Google Maps",data.maps_url]);
if(data.two_gis_url)links.push(["🗺️ 2ГИС",data.two_gis_url]);

if(links.length){
document.getElementById("linksSection").style.display="block";
const container=document.getElementById("links");
links.forEach(([label,url])=>{
const a=document.createElement("a");
a.className="link";
a.href=url;
a.textContent=label;
a.target="_blank";
a.rel="noopener";
container.appendChild(a);
});
}

if(data.address){
document.getElementById("addressSection").style.display="block";
document.getElementById("address").textContent=data.address;
}
}catch(e){
document.getElementById("name").textContent="Ресторан не найден";
status.textContent="Не удалось загрузить ресторан. Проверьте ссылку.";
console.error(e);
}
}

function copyPassword(){
if(!wifiPass){alert("Пароль не указан");return;}
navigator.clipboard.writeText(wifiPass)
.then(()=>alert("Пароль скопирован"))
.catch(()=>alert("Не удалось скопировать"));
}
load();
</script>
</body>
</html>
