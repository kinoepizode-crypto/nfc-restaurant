
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Администратор NFC SMART</title>
<style>
body{font-family:Arial;background:#f1f3f5;padding:15px;color:#111}
.box{max-width:600px;margin:auto;background:white;padding:20px;border-radius:18px}
input,textarea,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ddd;font-size:16px}
textarea{min-height:75px}
button{background:#111;color:white;border:0}
#admin{display:none}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
h3{margin-top:25px}
.business{padding:12px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.business a{display:block;margin:7px 0}
.copy{background:#2463eb}
.hide{background:#dc2626}
.restore{background:#15803d}
</style>
</head>
<body>
<div class="box">
<h2>Администратор NFC SMART</h2>

<div id="login">
<input id="email" placeholder="Email администратора" type="email">
<input id="password" placeholder="Пароль" type="password">
<button onclick="login()">Войти</button>
</div>

<div id="admin">
<h3>Добавить ресторан</h3>
<input id="restaurant" placeholder="Название ресторана">
<input id="slug" placeholder="Адрес ссылки (например coffee-bishkek)">
<textarea id="description" placeholder="Описание ресторана"></textarea>
<input id="address" placeholder="Физический адрес">
<input id="phone" placeholder="Телефон">
<input id="wifi_name" placeholder="Название Wi-Fi">
<input id="wifi_password" placeholder="Пароль Wi-Fi">
<input id="menu_url" placeholder="Ссылка на меню">
<input id="instagram" placeholder="Ссылка на Instagram">
<input id="whatsapp" placeholder="Ссылка на WhatsApp">
<input id="maps_url" placeholder="Ссылка Google Maps">
<input id="two_gis_url" placeholder="Ссылка 2GIS">

<h3>Аккаунт владельца</h3>
<input id="owner_email" placeholder="Email владельца" type="email">
<input id="owner_password" placeholder="Пароль владельца (минимум 6 символов)" type="text">

<button onclick="createBusiness()">Создать ресторан и аккаунт владельца</button>

<h3>Рестораны</h3>
<button onclick="loadBusinesses()">Обновить список</button>
<button onclick="toggleHidden()">Показать скрытые рестораны</button>
<div id="list"></div>
<button onclick="logout()">Выйти</button>
</div>

<p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient(
"https://pyeydqohexospkzzehtz.supabase.co",
"sb_publishable_X_pgMWZNfTyELx6z-Y4f1Q_3qwj6FEc"
);

const SITE_URL="https://nfc-restaurant-two.vercel.app/";
let showHidden=false;

function msg(t){
document.getElementById("status").textContent=t;
}

function publicLink(slug){
return SITE_URL+"?slug="+encodeURIComponent(slug);
}

function getHidden(){
try{
return JSON.parse(localStorage.getItem("nfc_hidden_businesses")||"[]");
}catch(e){
return [];
}
}

function saveHidden(ids){
localStorage.setItem("nfc_hidden_businesses",JSON.stringify(ids));
}

async function copyLink(slug){
const url=publicLink(slug);
try{
await navigator.clipboard.writeText(url);
msg("Ссылка скопирована:\n"+url);
}catch(e){
msg("Скопируй ссылку вручную:\n"+url);
}
}

async function login(){
msg("Вход...");
try{
const {data,error}=await client.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});
if(error)throw error;

const {data:p,error:pe}=await client
.from("profiles").select("role").eq("id",data.user.id).single();

if(pe)throw pe;
if(p.role!=="admin")throw new Error("Нет прав администратора");

document.getElementById("login").style.display="none";
document.getElementById("admin").style.display="block";
msg("Вход успешен");
loadBusinesses();
}catch(e){
msg("Ошибка: "+e.message);
}
}

async function createBusiness(){
msg("Создание ресторана и аккаунта владельца...");

try{
const name=document.getElementById("restaurant").value.trim();
const slug=document.getElementById("slug").value.trim()
.toLowerCase().replace(/[^a-z0-9-]/g,"-")
.replace(/-+/g,"-").replace(/^-|-$/g,"");

const ownerEmail=document.getElementById("owner_email").value.trim();
const ownerPassword=document.getElementById("owner_password").value;

if(!name||!slug)throw new Error("Заполни название и адрес ссылки");
if(!ownerEmail||!ownerPassword)throw new Error("Заполни email и пароль владельца");
if(ownerPassword.length<6)throw new Error("Пароль должен быть минимум 6 символов");

const fields=[
"description","address","phone","wifi_name","wifi_password",
"menu_url","instagram","whatsapp","maps_url","two_gis_url"
];

const business={name,slug};
fields.forEach(id=>{
business[id]=document.getElementById(id).value.trim()||null;
});

const {data,error}=await client
.from("businesses")
.insert(business)
.select("id,name,slug")
.single();

if(error)throw error;

msg("Ресторан создан. Создаём аккаунт владельца...");

const {data:ownerData,error:ownerError}=await client.functions.invoke(
"swift-worker",
{
body:{
business_id:data.id,
email:ownerEmail,
password:ownerPassword
}
}
);

if(ownerError){
throw new Error("Ресторан создан, но аккаунт владельца не создан: "+ownerError.message);
}

if(ownerData?.error){
throw new Error(ownerData.error);
}

if(!ownerData?.success){
throw new Error("Не удалось подтвердить создание аккаунта владельца");
}

msg(
"УСПЕШНО!\n\n"+
"Ресторан: "+data.name+
"\nNFC-ссылка:\n"+publicLink(data.slug)+
"\n\nАккаунт владельца:\n"+ownerEmail+
"\nПароль: "+ownerPassword+
"\n\nПанель владельца:\n"+ownerData.owner_url
);

document.querySelectorAll("#admin input,#admin textarea")
.forEach(el=>el.value="");

await loadBusinesses();

}catch(e){
msg("Ошибка: "+e.message);
}
}

async function loadBusinesses(){
try{
const {data,error}=await client
.from("businesses").select("id,name,slug")
.order("created_at",{ascending:false});

if(error)throw error;

const list=document.getElementById("list");
list.innerHTML="";

const hidden=getHidden();

const filtered=data.filter(b=>
showHidden?hidden.includes(b.id):!hidden.includes(b.id)
);

if(filtered.length===0){
list.textContent=showHidden?"Скрытых ресторанов нет":"Ресторанов нет";
return;
}

filtered.forEach(b=>{
const div=document.createElement("div");
div.className="business";

const title=document.createElement("strong");
title.textContent=b.name;

const link=document.createElement("a");
link.href=publicLink(b.slug);
link.target="_blank";
link.rel="noopener";
link.textContent=publicLink(b.slug);

const copy=document.createElement("button");
copy.className="copy";
copy.textContent="Скопировать NFC-ссылку";
copy.onclick=()=>copyLink(b.slug);

const action=document.createElement("button");

if(showHidden){
action.className="restore";
action.textContent="Вернуть в админку";
action.onclick=()=>{
saveHidden(getHidden().filter(id=>id!==b.id));
msg("Ресторан возвращён в список");
loadBusinesses();
};
}else{
action.className="hide";
action.textContent="Убрать из моей админки";
action.onclick=()=>{
if(!confirm("Убрать ресторан из твоего списка? Сайт владельца останется работать."))return;
saveHidden([...getHidden(),b.id]);
msg("Ресторан скрыт. Сайт владельца не удалён.");
loadBusinesses();
};
}

div.append(title,link,copy,action);
list.appendChild(div);
});

}catch(e){
msg("Ошибка списка: "+e.message);
}
}

function toggleHidden(){
showHidden=!showHidden;
document.querySelector("#admin button:nth-of-type(2)").textContent=
showHidden?"Вернуться к ресторанам":"Показать скрытые рестораны";
loadBusinesses();
}

async function logout(){
await client.auth.signOut();
location.reload();
}
</script>
</body>
</html>
