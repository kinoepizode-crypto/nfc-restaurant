
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC SMART — Карта лояльности</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#101318;color:white;
font-family:Arial,sans-serif;padding:20px
}
.container{max-width:420px;margin:35px auto}
.card{
background:linear-gradient(145deg,#222632,#151820);
border:1px solid #343a47;border-radius:24px;padding:25px
}
.logo{color:#aaa;font-size:13px;margin-bottom:25px}
h1{font-size:27px;margin:0 0 12px}
p{color:#b0b7c4;line-height:1.5}
.stamps{
display:grid;grid-template-columns:repeat(4,1fr);
gap:10px;margin:25px 0
}
.stamp{
height:65px;border:1px dashed #606878;
border-radius:15px;display:flex;
align-items:center;justify-content:center;font-size:23px
}
.stamp.active{background:#d9ffe1;color:#17271c;border:0}
button{
width:100%;padding:16px;border:0;border-radius:12px;
background:white;color:#111;font-size:16px;
font-weight:bold;margin-top:12px
}
.note{text-align:center;font-size:12px;color:#888;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<div class="card">

<div class="logo">NFC SMART</div>

<h1>☕ Карта лояльности</h1>
<p>7 покупок — 8-й кофе бесплатно!</p>

<div class="stamps">
<div class="stamp">☕</div>
<div class="stamp">☕</div>
<div class="stamp">☕</div>
<div class="stamp">☕</div>
<div class="stamp">☕</div>
<div class="stamp">☕</div>
<div class="stamp">☕</div>
<div class="stamp">🎁</div>
</div>

<div id="message">
<p>Создай свою карту лояльности.</p>
</div>

<button onclick="createCard()">Получить карту</button>

<div class="note">
NFC SMART · Loyalty
</div>

</div>
</div>

<script>
function createCard(){
let code=localStorage.getItem("loyalty_code");

if(!code){
code="LS-"+Math.random().toString(36).substring(2,10).toUpperCase();
localStorage.setItem("loyalty_code",code);
}

document.getElementById("message").innerHTML=
'<p>Ваша карта создана!</p>'+
'<p style="text-align:center;font-size:24px;color:white;font-weight:bold">'+code+'</p>'+
'<p>Сохраните этот код, чтобы не потерять карту.</p>';
}
</script>
</body>
</html>
